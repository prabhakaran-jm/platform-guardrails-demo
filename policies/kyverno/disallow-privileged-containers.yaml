# What the guardrail does: Blocks pods attempting to run as privileged.
# Where it runs: Kubernetes Admission Controller.
# How to narrate: "Instead of hoping developers don't run privileged containers, we automate the boundary."
# Why this is a guardrail: Feedback is immediate inside the developer's normal workflow.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: validate-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "privileged containers are not allowed"
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"
