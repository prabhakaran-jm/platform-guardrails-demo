# What the guardrail does: Enforces CPU and memory requests and limits.
# Where it runs: Kubernetes Admission Controller.
# How to narrate: "We prevent noisy-neighbor workloads before they enter the cluster."
# Why this is a guardrail: It protects cluster stability without manual review.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: validate-resources
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "resource requests and limits are required for cpu and memory"
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"