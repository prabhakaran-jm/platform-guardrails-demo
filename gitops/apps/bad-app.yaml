# Example GitOps Representation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-bad-gitops
  labels:
    app: demo-bad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-bad
  template:
    metadata:
      labels:
        app: demo-bad
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          securityContext:
            privileged: true
